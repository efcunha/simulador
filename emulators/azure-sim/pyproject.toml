# Config of record for the emulators/azure-sim package (Phase 2).
#
# Mirrors tools/synthetic_clouds/pyproject.toml (design §2/§10): ruff and mypy
# discover configuration by walking UP from the target file, and
# pyproject.toml do consumidor is a SIBLING subtree, never an ancestor of
# emulators/azure-sim/. Without this file ruff would fall back to line-length 88.
# Writing it INSIDE the permitted package path is allowed; a root config would
# not be. Values (line-length 120, py312, select set, mypy strict +
# ignore_missing_imports) are copied from the Phase 1 package so
# `ruff check emulators/azure-sim` / `mypy emulators/azure-sim` run clean from the
# worktree root.
#
# Import mechanism (design §2/§6.1): azure-sim imports the Phase 1 generator as
# the namespace path ``tools.synthetic_clouds.*`` resolved via PYTHONPATH, NOT a
# wheel install. Therefore this file lists ONLY third-party deps and MUST NOT
# declare ``FinOps-synthetic-clouds`` as a dependency.
[project]
name = "FinOps-azure-sim"
version = "0.1.0"
description = "FinOps Azure synthetic-cloud simulator (Phase 2): Cost Management exports + control-plane APIs."
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "azure-storage-blob",
  "pyarrow",
]

[project.optional-dependencies]
test = [
  "httpx",
  "pytest",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "ANN", "ASYNC"]
ignore = [
  "ANN401",  # Allow Any type when needed (complex generics)
  "S101",
  "E501",    # Line-too-long enforced by formatter, not linter
  "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests: assert-heavy, fixtures, intentionally loose typing (mirrors Phase 1).
# The glob is anchored at this config dir, and the test package is nested at
# ``azure_sim/tests`` (not directly under the config dir as in Phase 1), so the
# pattern needs the ``**/`` prefix to match the nested path.
"**/tests/*" = ["S", "ANN", "B017", "N805", "F841", "F821", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disable_error_code = ["type-arg", "unused-ignore"]
# azure-sim is imported as the top-level ``azure_sim`` package AND it imports the
# Phase 1 generator as ``tools.synthetic_clouds``. explicit_package_bases + a
# two-entry mypy_path pin both namespaces (mirrors the sys.path wiring in
# azure_sim/tests/conftest.py). mypy resolves relative mypy_path entries against
# the invocation CWD (the worktree root): ``emulators/azure-sim`` resolves the
# top-level ``azure_sim`` package and ``.`` resolves ``tools.synthetic_clouds``
# from the worktree root. The list form avoids OS-specific path separators. The
# official gate invocation is the Phase 1 module form, run from the worktree root:
#   mypy --config-file emulators/azure-sim/pyproject.toml -p azure_sim
# mypy does NOT walk up to auto-discover this file (unlike ruff), so
# --config-file is required; see docs/synthetic-clouds/verification.md.
explicit_package_bases = true
mypy_path = ["emulators/azure-sim", "."]
namespace_packages = true

[[tool.mypy.overrides]]
# Tests are intentionally loose: pytest decorators (@pytest.fixture,
# @pytest.mark.*) are untyped (framework limitation), and fixture params / helper
# calls are left unannotated on purpose. This is the mypy analog of the ruff
# ``ANN`` per-file-ignore for ``**/tests/*`` above — the two gates must agree on
# what "loose test typing" means. Scoped to the test package only, so strict
# typing still applies to all shipped azure_sim source.
module = ["azure_sim.tests.*"]
disable_error_code = ["untyped-decorator", "no-untyped-def", "no-untyped-call"]
