# Config of record for the gcp-sim FastAPI service (Phase 3).
#
# Mirrors tools/synthetic_clouds/pyproject.toml (line-length 120, target py312,
# same ruff select/ignore set, mypy strict + same disable_error_code) so
# `ruff check .` / `mypy .` from this directory discover the config here. The
# package is `gcp_sim` (flat), so no explicit_package_bases gymnastics needed.
[project]
name = "FinOps-gcp-sim"
version = "0.1.0"
description = "FinOps synthetic GCP control-plane REST sim (Phase 3)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "ANN", "ASYNC"]
ignore = [
  "ANN401",  # Allow Any type when needed (complex generics)
  "S101",
  "E501",    # Line-too-long enforced by formatter, not linter
  "B008",    # FastAPI uses function calls (Depends/Query) in argument defaults
]

[tool.ruff.lint.per-file-ignores]
# Tests: assert-heavy, fixtures, intentionally loose typing (mirrors backend).
"tests/*" = ["S", "ANN", "B017", "N805", "F841", "F821", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disable_error_code = ["type-arg", "unused-ignore"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["untyped-decorator"]
