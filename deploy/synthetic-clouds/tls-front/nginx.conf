# TLS front for the GCP hostnames CloudPilot's real SDK calls.
#
# The CloudPilot containers address the REAL names (no endpoint override):
#   https://bigquery.googleapis.com/...  -> bqemulator (REST, plain HTTP :9050)
#   https://oauth2.googleapis.com/token  -> gcp-sim OAuth stub (:8085)
#   https://compute.googleapis.com/...   -> gcp-sim REST plane (:8085)
#   https://container.googleapis.com/... -> gcp-sim REST plane (:8085)
#   https://securitycenter.googleapis.com -> gcp-sim SCC gRPC plane (:8088)
#
# The leaf is the same one azure-sim serves (SANs include both names), signed by
# the local CA mounted into the CloudPilot containers at /certs. This container
# only terminates TLS and forwards; it adds no behaviour of its own.
#
# One server block per hostname (rather than a variable upstream) so nginx
# resolves the emulator names at startup through the container DNS.

upstream bq_emulator {
    server bigquery-emulator:9050;
}

upstream gcp_oauth {
    server gcp-sim:8085;
}

upstream aws_sim {
    server aws-sim:8086;
}

# The Security Command Center client library speaks gRPC (its transport
# registry puts "grpc" first), so the Security Center host needs a gRPC
# upstream -- the plane the gcp-sim serves the findings on.
upstream gcp_scc_grpc {
    server gcp-sim:8088;
}

server {
    listen 443 ssl;
    server_name bigquery.googleapis.com;

    ssl_certificate     /certs/server-clouds.crt;
    ssl_certificate_key /certs/server-clouds.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # BigQuery REST payloads can be large (query results), so no request-size
    # guess here beyond nginx's default 1m; raise it to match real responses.
    client_max_body_size 64m;

    location / {
        proxy_pass http://bq_emulator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    server_name oauth2.googleapis.com;

    ssl_certificate     /certs/server-clouds.crt;
    ssl_certificate_key /certs/server-clouds.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://gcp_oauth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Cloud Resource Manager: the GCP connection validator calls
# https://cloudresourcemanager.googleapis.com/v1/projects (googleapiclient ships
# a static discovery document, so no discovery HTTP request is made).
server {
    listen 443 ssl;
    server_name cloudresourcemanager.googleapis.com;

    ssl_certificate     /certs/server-clouds.crt;
    ssl_certificate_key /certs/server-clouds.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://gcp_oauth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# AWS STS: boto3's global endpoint (sts.amazonaws.com) and the regional
# spelling. The emulator answers the Query protocol on any path; routing is by
# hostname so the client's signing target stays the real one.
server {
    listen 443 ssl;
    server_name sts.amazonaws.com sts.us-east-1.amazonaws.com;

    ssl_certificate     /certs/server-clouds.crt;
    ssl_certificate_key /certs/server-clouds.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://aws_sim;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Compute Engine: the GCP security check lists the firewall rules with
# https://compute.googleapis.com/compute/v1/projects/<project>/global/firewalls
# (the compute client is REST). The gcp-sim serves the whole REST plane on
# :8085, the same upstream the OAuth and Cloud Resource Manager hosts use.
server {
    listen 443 ssl;
    server_name compute.googleapis.com;

    ssl_certificate     /certs/server-clouds.crt;
    ssl_certificate_key /certs/server-clouds.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://gcp_oauth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

# Infrastructure Manager: the GCP client calls
# https://config.googleapis.com/v1/projects/<project>/locations/<location>/previews/<preview>/resourceDrifts
# (resourceDrifts.list). The REST plane lives on gcp-sim :8085, like Compute.
server {
    listen 443 ssl;
    server_name config.googleapis.com;

    ssl_certificate     /certs/server-clouds.crt;
    ssl_certificate_key /certs/server-clouds.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://gcp_oauth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

# Kubernetes Engine: the client lists the clusters of a project with
# https://container.googleapis.com/v1/projects/<project>/locations/<location>/clusters
# (projects.locations.clusters.list). The REST plane lives on gcp-sim :8085, like
# Compute and Infrastructure Manager.
server {
    listen 443 ssl;
    server_name container.googleapis.com;

    ssl_certificate     /certs/server-clouds.crt;
    ssl_certificate_key /certs/server-clouds.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://gcp_oauth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

# Security Command Center: the client library opens a gRPC channel to
# https://securitycenter.googleapis.com/google.cloud.securitycenter.v1.SecurityCenter/ListFindings.
# The TLS front terminates the client's TLS and forwards the gRPC call to the
# plane the gcp-sim serves it on -- "http2" on the listen directive is what
# lets the client negotiate HTTP/2 (and ALPN advertises it).
server {
    listen 443 ssl http2;
    server_name securitycenter.googleapis.com;

    ssl_certificate     /certs/server-clouds.crt;
    ssl_certificate_key /certs/server-clouds.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        grpc_pass grpc://gcp_scc_grpc;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_read_timeout 300s;
    }
}

# Plain HTTP on 80 is not part of the contract; answer only the health probe so
# the compose healthcheck has something to hit.
server {
    listen 80;
    server_name _;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        return 404;
    }
}
