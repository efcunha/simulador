# compose.aws.yaml -- AWS side of the synthetic-clouds simulator (Phase 6, Item 6).
#
# Podman-compatible. AWS services live in THEIR OWN file so the hardened azure and GCP
# fragments are not re-opened; scripts/synthetic-clouds/up.ps1 brings all three up.
#
# HARD CONSTRAINTS (design sec. 2, sec. 6; DISCOVERY Spike):
#   * NO Windows drive bind-mount (the spike's `statfs ... input/output error`). All state
#     lives in NAMED VOLUMES; rendered artefacts arrive via the uploader from
#     scripts/synthetic-clouds/aws-up.ps1, never a drive mount.
#
# S3 SUBSTITUTE -- MinIO is NOT obtainable, and that is a measured fact, not a preference.
# The design named MinIO; `podman pull` for it fails on every official registry:
#   docker.io/minio/minio:latest  -> denied: requested access to the resource is denied
#   quay.io/minio/minio:latest    -> unauthorized: access to the requested resource is not
#                                    authorized
# while `docker.io/library/busybox:latest` pulls normally, so the registry itself is
# reachable and MinIO specifically is not. `adobe/s3mock` is used instead: an S3 mock built
# for exercising S3 clients offline, published openly, and verified in-container here --
# `GET /` returns 200 (ListBuckets) and `PUT /{bucket}` returns 200 (CreateBucket).
#
# The env var names are S3-neutral (`S3_ENDPOINT`, `S3_ACCESS_KEY`, `S3_SECRET_KEY`) rather
# than `MINIO_*`: they describe the role, and a name that points at a service no longer in
# the stack is how the next person loses an hour. s3mock ignores credentials entirely, so
# their values are inert; they stay env-driven because the client still requires them.
#
# WHICH STORE ANSWERS FinOps S3 CLIENT -- s3mock is NOT the one, and cannot be.
# `AWS_SERVICE_ENDPOINT` (endpoint.py (modulo do consumidor)) is ONE endpoint
# for every AWS service, because boto3 takes `endpoint_url` per client() and nowhere else;
# there is no per-service override to point `s3` at :9090. So FinOps S3 client lands
# on aws-sim, and aws-sim serves the S3 REST surface itself over the SAME rendered tree the
# uploader pushes -- `AWS_SIM_S3_STORE_DIR=/render/aws_focus` is the uploader's own source
# directory (see emulators/aws-sim/aws_sim/api/s3.py and s3_store.py for the choice and what
# it costs). s3mock keeps the upload target role and the proof that `aws_sim.upload` works
# against a real S3 implementation; it is not in the path FinOps reads.
services:
  s3mock:
    image: docker.io/adobe/s3mock:latest
    environment:
      # Buckets are created on demand by the uploader's ensure_bucket(), so the store does
      # not need to be pre-seeded.
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: "${AWS_SIM_BUCKET:-synthetic-focus12-daily-full}"
    ports:
      - "${S3_PORT:-9090}:9090"
    networks:
      synthclouds_aws:
      synthclouds_net:
        aliases:
          - s3mock
    # No compose healthcheck: the image is a JRE and is not guaranteed to ship curl, and a
    # probe that cannot run reports unhealthy rather than passing. Readiness is proven the
    # same way the GCP plane proves it -- a host-side HTTP poll in aws-up.ps1 against the
    # URL verified above -- and `service_started` is the honest dependency.
    restart: unless-stopped

  aws-sim:
    build:
      # Build context = worktree root (contains tools/ and services/), one level up from
      # this deploy/ dir.
      context: ../..
      dockerfile: emulators/aws-sim/Containerfile
    networks:
      synthclouds_aws:
      synthclouds_net:
        aliases:
          - aws-sim
    depends_on:
      s3mock:
        condition: service_started
    ports:
      - "${AWS_SIM_PORT:-8086}:8086"
    environment:
      # --- simulator settings (aws_sim/config.py) ---
      SEED: "${AWS_SIM_SEED:-123}"
      PROFILE: "${AWS_SIM_PROFILE:-small}"
      CURRENCY: "${CURRENCY:-USD}"
      AWS_SIM_REGION: "${AWS_SIM_REGION:-us-east-1}"
      API_PAGE_SIZE: "${API_PAGE_SIZE:-1000}"
      AWS_SIM_PORT: "8086"
      # --- uploader target, as seen from INSIDE the network (service name) ---
      S3_ENDPOINT: "http://s3mock:9090"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-synth}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-synth}"
      AWS_SIM_BUCKET: "${AWS_SIM_BUCKET:-synthetic-focus12-daily-full}"
      # --- where the rendered tree is copied to, then uploaded from ---
      AWS_SIM_RENDER_DIR: "/render"
      # --- the S3 surface this shim serves on its own endpoint (aws_sim/api/s3.py).
      #     The store root IS the uploader's source directory, so a path under it is a key
      #     verbatim; the bucket is the name the uploader was given. Unset (the default)
      #     serves the estate's bucket list with every object listing empty. ---
      AWS_SIM_S3_STORE_DIR: "${AWS_SIM_S3_STORE_DIR:-/render/aws_focus}"
    volumes:
      # Named volume only, per the hard constraint above.
      - "aws_sim_render:/render"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8086/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  synthclouds_aws:
    driver: bridge

  # Shared network for the simulators. In this tree it is compose-OWNED (not
  # `external: true`), so `podman compose up` creates it and the stack comes
  # up standalone -- no other stack has to exist first.
  #
  # The per-service `aliases:` below is what registers the name the clients
  # resolve (for example `aws-sim`). The service name alone is NOT enough on
  # an external network: it is registered on the compose-owned network only.
  synthclouds_net:
    driver: bridge

volumes:
  aws_sim_render:
