# compose.gcp.yaml -- GCP side of the synthetic-clouds simulator (Phase 3).
#
# Podman-compatible (podman compose / podman-compose). GCP services live in THIS
# file (not a shared compose) so Phase 2's azure-sim additions cannot collide on
# merge; a later integration step merges azure + gcp compose.
#
# HARD CONSTRAINTS (design sec. 2, sec. 6; DISCOVERY Spike):
#   * bigquery-emulator is bqemulator (DuckDB + SQLGlot), not goccy. goccy
#     creates the documented schema but cannot SCAN a RECORD that contains a
#     REPEATED field ("failed to convert struct from array") — project.ancestors
#     and project.labels in the detailed export. The CloudPilot reader keeps
#     selecting the real struct; the emulator is what must match BigQuery.
#     Tables are still provisioned via DDL CREATE TABLE ... ARRAY<STRUCT<...>> +
#     insertAll by the one-shot gcp-bq-provision container
#     (python -m gcp_sim.provision).
#   * NO Windows drive bind-mount (the spike's statfs ... input/output error):
#     all state lives in NAMED VOLUMES; rendered scripts/fixtures arrive via
#     `podman cp` from scripts/synthetic-clouds/gcp-up.ps1, never a drive mount.
services:
  bigquery-emulator:
    # bqemulator (DuckDB + SQLGlot) instead of goccy: goccy creates the
    # documented schema but cannot SCAN a RECORD that contains a REPEATED field
    # ("failed to convert struct from array") — exactly project.ancestors /
    # project.labels in the detailed export. The CloudPilot reader must keep
    # selecting the real struct; the emulator is the layer that has to match
    # BigQuery, not the client. bqemulator returns the whole struct and is
    # compatible with the google-cloud-bigquery REST calls the reader makes.
    image: ghcr.io/jjviscomi/bqemulator:latest
    # Defaults: REST 9050, gRPC 9060. No project flag — it comes per request.
    ports:
      - "${GCP_BQ_REST_PORT:-9050}:9050"
      - "${GCP_BQ_GRPC_PORT:-9060}:9060"
    networks:
      synthclouds_gcp:
      synthclouds_net:
        aliases:
          - bigquery-emulator
    healthcheck:
      # bqemulator ships Python and exposes an HTTP /healthz; the old goccy
      # image had no curl/wget and probed the TCP socket instead.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9050/healthz', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20

  gcp-bq-provision:
    build:
      # Build context = worktree root (contains tools/ and deploy/), one level up from
      # this deploy/ dir, so tools.synthetic_clouds can be baked in (mirrors aws-sim).
      context: ../..
      dockerfile: emulators/gcp-sim/Dockerfile
    command:
      - "python"
      - "-m"
      - "gcp_sim.provision"
      - "--manifest"
      - "/provision/gcp_bigquery_topology/_provenance.json"
      - "--endpoint"
      - "http://bigquery-emulator:9050"
      - "--project"
      - "${GCP_PROJECT:-synthetic}"
    depends_on:
      bigquery-emulator:
        condition: service_healthy
    volumes:
      # Rendered DDL/INSERT scripts land here via `podman cp` (gcp-up.ps1), never
      # a drive bind-mount.
      - "gcp_provision:/provision"
    networks:
      - synthclouds_gcp
    restart: "no"

  gcp-sim:
    build:
      # Build context = worktree root, so tools.synthetic_clouds is baked in (mirrors aws-sim).
      context: ../..
      dockerfile: emulators/gcp-sim/Dockerfile
    command:
      - "uvicorn"
      - "gcp_sim.app:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8085"
    ports:
      - "${GCP_SIM_PORT:-8085}:8085"
      # The Cloud Monitoring gRPC plane (FR-25). monitoring_v3 ships NO REST transport in any
      # released version, so the sim serves ListTimeSeries / ListMetricDescriptors /
      # ListAlertPolicies over gRPC from the client's own proto descriptors; the client reaches
      # it via GCP_MONITORING_API_ENDPOINT (see .env.example).
      - "${GCP_SIM_GRPC_PORT:-8087}:8087"
    environment:
      # gcp-up.ps1 copies the rendered `gcp_rest_fixtures/` dir into the volume via
      # `podman cp`, so the JSON files live under /fixtures/gcp_rest_fixtures/.
      - "GCP_SIM_FIXTURES_DIR=/fixtures/gcp_rest_fixtures"
    volumes:
      # Rendered REST fixtures land here via `podman cp` (gcp-up.ps1).
      - "gcp_sim_fixtures:/fixtures"
    networks:
      synthclouds_gcp:
      synthclouds_net:
        aliases:
          - gcp-sim
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "-qO-"
        - "http://localhost:8085/healthz"
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  gcp_provision: {}
  gcp_sim_fixtures: {}

networks:
  synthclouds_gcp: {}

  # Shared network for the simulators. In this tree it is compose-OWNED (not
  # `external: true`), so `podman compose up` creates it and the stack comes
  # up standalone -- no other stack has to exist first.
  #
  # The per-service `aliases:` below is what registers the name the clients
  # resolve (for example `aws-sim`). The service name alone is NOT enough on
  # an external network: it is registered on the compose-owned network only.
  synthclouds_net:
    driver: bridge
