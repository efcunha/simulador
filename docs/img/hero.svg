<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Synthetic multi-cloud data served over real API contracts. 49 export surfaces specified, four emulators (AWS, GCP, Azure and Kubernetes), 0 invented columns, 0 billable cloud calls.">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="249" rx="16" fill="url(#heroBg)" stroke="#E2E8F0"/>
  <rect x="1" y="1" width="5" height="248" rx="2.5" fill="#2563EB"/>

  <text x="36" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#0F172A">Synthetic multi-cloud data, real API contracts</text>
  <text x="36" y="90" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#334155">FinOps, security, network, instance and drift data for AWS, GCP, Azure and Kubernetes -</text>
  <text x="36" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#334155">generated by one deterministic engine, served over the very APIs the clouds expose.</text>

  <g>
    <rect x="36" y="148" width="192" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="52" y="177" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#2563EB">49</text>
    <text x="52" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" letter-spacing="0.8" fill="#64748B">EXPORT SURFACES</text>
  </g>
  <g>
    <rect x="240" y="148" width="192" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="256" y="177" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#2563EB">4</text>
    <text x="256" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" letter-spacing="0.8" fill="#64748B">EMULATORS</text>
  </g>
  <g>
    <rect x="444" y="148" width="192" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="460" y="177" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#059669">0</text>
    <text x="460" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" letter-spacing="0.8" fill="#64748B">INVENTED COLUMNS</text>
  </g>
  <g>
    <rect x="648" y="148" width="192" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="664" y="177" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#059669">0</text>
    <text x="664" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" letter-spacing="0.8" fill="#64748B">BILLABLE CALLS</text>
  </g>

  <text x="36" y="233" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748B">Every field name cited to official provider documentation. Same seed, same bytes. No invented column.</text>
</svg>
