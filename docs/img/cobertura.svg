<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Coverage: 46 export surfaces specified, 45 ready, 1 blocked by documentation, 0 invented columns. AWS 15 of 15, GCP 21 of 21, Azure 9 of 10.">
  <rect x="0.5" y="0.5" width="879" height="339" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>

  <text x="32" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#0F172A">Coverage, measured</text>
  <text x="32" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#64748B">Export surfaces specified per cloud, and how many are ready to use.</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0F172A">
    <text x="32" y="133">AWS</text>
    <text x="32" y="179">GCP</text>
    <text x="32" y="225">Azure</text>
  </g>

  <rect x="110" y="112" width="286" height="30" rx="8" fill="#059669"/>
  <text x="124" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">15 ready</text>
  <text x="530" y="133" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">15 / 15</text>

  <rect x="110" y="158" width="400" height="30" rx="8" fill="#059669"/>
  <text x="124" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">21 ready</text>
  <text x="530" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">21 / 21</text>

  <rect x="110" y="204" width="171.5" height="30" rx="8" fill="#059669"/>
  <path d="M281.5 204 H292 a8 8 0 0 1 8 8 v14 a8 8 0 0 1 -8 8 H281.5 Z" fill="#D97706"/>
  <text x="124" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">9 ready</text>
  <text x="530" y="225" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">9 / 10</text>

  <rect x="32" y="258" width="12" height="12" rx="3" fill="#059669"/>
  <text x="52" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">ready (PRONTO)</text>
  <rect x="168" y="258" width="12" height="12" rx="3" fill="#D97706"/>
  <text x="188" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">blocked by documentation - a deliberate refusal</text>

  <rect x="580" y="96" width="268" height="172" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="600" y="136" font-size="23" font-weight="700" fill="#0F172A">46</text>
    <text x="650" y="136" font-size="12" fill="#475569">specified</text>
    <text x="600" y="176" font-size="23" font-weight="700" fill="#059669">45</text>
    <text x="650" y="176" font-size="12" fill="#475569">ready</text>
    <text x="600" y="216" font-size="23" font-weight="700" fill="#D97706">1</text>
    <text x="650" y="216" font-size="12" fill="#475569">blocked by docs</text>
    <text x="600" y="256" font-size="23" font-weight="700" fill="#059669">0</text>
    <text x="650" y="256" font-size="12" fill="#475569">invented columns</text>
  </g>

  <text x="32" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748B">The single blocked surface is a refusal, not a gap: the provider publishes 132 field names</text>
  <text x="32" y="319" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748B">without types, and none of them appears in all five contracts at once.</text>
</svg>
