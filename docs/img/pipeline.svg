<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img" aria-label="How the data flows: specs are the source of truth, a deterministic generator renders them, three API emulators serve them, and a consumer ingests over its own production path.">
  <rect x="0.5" y="0.5" width="879" height="369" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>

  <text x="32" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#0F172A">How the data flows</text>
  <text x="32" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#64748B">One deterministic engine, three API emulators, zero calls to the real cloud.</text>

  <g>
    <rect x="32" y="104" width="180" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="58" cy="134" r="15" fill="#7C3AED"/>
    <text x="58" y="139" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <text x="82" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Specs</text>
    <text x="48" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">The source of truth</text>
    <text x="48" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">46 export surfaces</text>
    <text x="48" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">AWS 15, GCP 21, Azure 10</text>
    <text x="48" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">Each field cites the docs</text>
  </g>

  <g>
    <rect x="244" y="104" width="180" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="270" cy="134" r="15" fill="#2563EB"/>
    <text x="270" y="139" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="294" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Generator</text>
    <text x="260" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">Deterministic engine</text>
    <text x="260" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">FOCUS 1.2, CUR 2.0,</text>
    <text x="260" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">BigQuery billing</text>
    <text x="260" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">Same seed, same bytes</text>
  </g>

  <g>
    <rect x="456" y="104" width="180" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="482" cy="134" r="15" fill="#0891B2"/>
    <text x="482" y="139" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <text x="506" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Emulators</text>
    <text x="472" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">Real API surfaces</text>
    <text x="472" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">AWS S3 + Query</text>
    <text x="472" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">GCP REST + gRPC</text>
    <text x="472" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">Azure ARM + exports</text>
  </g>

  <g>
    <rect x="668" y="104" width="180" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="694" cy="134" r="15" fill="#059669"/>
    <text x="694" y="139" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
    <text x="718" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Consumer</text>
    <text x="684" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">Official SDKs only</text>
    <text x="684" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">Ingests over the</text>
    <text x="684" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">production path</text>
    <text x="684" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">Never knows it is fake</text>
  </g>

  <g stroke="#94A3B8" stroke-width="2" fill="none">
    <line x1="216" y1="179" x2="234" y2="179"/>
    <line x1="428" y1="179" x2="446" y2="179"/>
    <line x1="640" y1="179" x2="658" y2="179"/>
  </g>
  <g fill="#94A3B8">
    <path d="M240 179 l-8 -5 l0 10 z"/>
    <path d="M452 179 l-8 -5 l0 10 z"/>
    <path d="M664 179 l-8 -5 l0 10 z"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle">
    <text x="228" y="168">derive</text>
    <text x="440" y="168">render</text>
    <text x="652" y="168">serve</text>
  </g>

  <rect x="32" y="286" width="816" height="58" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="440" y="311" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#065F46">The simulator never calls the real cloud and never writes to anyone's database.</text>
  <text x="440" y="331" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#047857">The consumer records what it ingests, through its own production path.</text>
</svg>
